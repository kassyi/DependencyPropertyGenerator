name: Bug report
description: File a bug report for Kassyi.Generators.DependencyProperty
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the bug
      description: Please enter a short, clear description of the bug.

  - type: dropdown
    validations:
      required: true
    attributes:
      label: Target UI Framework
      description: Which UI framework / platform are you targeting?
      options:
        - "WPF"
        - "Avalonia"
        - ".NET MAUI"
        - "Uno Platform (WinUI / UWP)"
        - "WinUI 3 / Windows App SDK"
        - "Other / Multi-targeting"

  - type: input
    validations:
      required: true
    attributes:
      label: Package version
      description: Specify the version of Kassyi.Generators.DependencyProperty (e.g. 1.0.0-preview.1).
      placeholder: "1.0.0-preview.1"

  - type: dropdown
    attributes:
      label: IDE / Tooling
      description: Which development environment are you using?
      multiple: true
      options:
        - "Visual Studio 2022"
        - "Visual Studio 2022 Preview"
        - "JetBrains Rider"
        - "Visual Studio Code (C# Dev Kit)"
        - ".NET CLI / dotnet build"
        - "Other"

  - type: textarea
    validations:
      required: true
    attributes:
      label: Minimal Reproducible Code
      description: Paste the minimal C# code containing the [DependencyProperty] definition that triggers the issue.
      render: csharp
      placeholder: |
        [DependencyProperty<string>("Text")]
        public partial class MyControl : Control
        {
        }

  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect the generator or compiler to output?

  - type: textarea
    attributes:
      label: Additional context & Screenshots
      description: Compiler error codes (e.g. CS0103), stack traces, or screenshots if applicable.
