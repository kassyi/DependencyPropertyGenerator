name: Publish to NuGet

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write # Required for NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with history for MinVer)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore Kassyi.Generators.DependencyProperty.sln

      - name: Run verification tests
        run: dotnet test Kassyi.Generators.DependencyProperty.sln --configuration Release --logger GitHubActions

      - name: Pack NuGet packages
        run: dotnet pack Kassyi.Generators.DependencyProperty.sln --configuration Release --no-build --output ./artifacts

      - name: NuGet Login (Trusted Publishing OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: kassyi

      - name: Publish NuGet package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            ./artifacts/*.nupkg \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
